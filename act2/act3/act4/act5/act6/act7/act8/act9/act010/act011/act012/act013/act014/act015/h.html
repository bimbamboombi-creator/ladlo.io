<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16act</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="css.css" />
  
</head>
<body>

<div id="game">

  <!-- Background image -->
  <div id="bg" style="background-image: url('gh.png');"></div>
  <!-- Mood colour overlay -->
  <div id="bg-overlay"></div>

  <!-- Rain atmosphere -->
  <div id="rain-layer"></div>

  
  <div class="character" id="char-raja">
    <div class="name-bubble name-bubble-raja" id="name-raja">king</div>
    <img src="king.png" alt="raja" />
  </div>

  
  <div class="character" id="char-kashish">
    <div class="name-bubble name-bubble-kashish" id="name-kashish">kashish</div>
    <img src="ladlo.png" alt="Kashish" />
  </div>

  
  <div class="character" id="char-suvam">
    <div class="name-bubble name-bubble-suvam" id="name-suvam">suvambhai</div>
    <img src="s.png" alt="Sam" />
  </div>

  
  <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>

  <!-- Skip -->
  <button id="skip-btn">SKIP ▶▶</button>

  <!-- Dialogue -->
  <div id="dialogue-wrap">
    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"><span id="text-content"></span><span id="cursor"></span></div>
      <div id="click-hint">▼ click to continue</div>
    </div>
  </div>

  <!-- Scene flash -->
  <div id="scene-flash"></div>

  <!-- Title overlay -->
  <div id="overlay">
    <div class="paw">🐾</div>
    <h1>kings palace<br><span>A Visual Novel</span></h1>
    <p>three ppl acting in a king's palace</p>
    <button class="btn" id="start-btn">Begin Story ▶</button>
  </div>
</div>
<script defer src="js.js"></script>

</body>
</html>
