<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hero</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Playfair+Display:ital,wght@0,400;0,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Letterbox film bars -->
  <div class="bar-top"></div>
  <div class="bar-bot"></div>

  <!-- Main stage -->
  <div id="stage">
    <div id="frame">

      <!-- Background image / gradient -->
      <div id="frame-bg"></div>

      <!-- Film corner marks -->
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <!-- Content -->
      <div id="content">
        <div id="count">Scene 1 / 9</div>

        <div id="line-box">
          <div id="line-text"></div>
        </div>

        <div id="bar-wrap">
          <div id="bar"></div>
        </div>

        <div id="btns">
          <button id="prev" disabled>◂ prev</button>
          <button id="next">next ▸</button>
          <button id="skip">next ep</button>
        </div>
      </div>

      <!-- Reel label -->
      <div id="reel">REEL I</div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
